name: Build check

# Nothing else validates a pull request, and main deploys straight to Pages —
# so a broken build has to be caught here, before it can take the app down.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Die zehn Nachrichten aus dem echten Geschäft. Was sie prüfen, ist nicht
      # die KI, sondern was ohne sie aus einem Text gelesen wird — und vor allem,
      # was NICHT: unser eigener Paketpreis als Käufergebot, eine Robot-Adresse
      # als Interessent, 29 Fässer an einer Frage nach einem.
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
